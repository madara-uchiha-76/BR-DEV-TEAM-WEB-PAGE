
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Preview | BR DEV TEAM</title>

  <style>
    :root {
      --bg: #080b12;
      --panel: #111827;
      --text: #f4f7ff;
      --muted: #a4aec2;
      --accent: #7c5cff;
      --cyan: #31d6ff;
      --border: rgba(255,255,255,.13);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1000px, 90%);
      margin: auto;
    }

    header {
      background: #0b0f19;
      border-bottom: 1px solid var(--border);
    }

    .nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo {
      font-weight: 800;
      font-size: 1.1rem;
    }

    .logo span {
      color: var(--cyan);
    }

    .back {
      color: var(--cyan);
      font-weight: 700;
    }

    main {
      padding: 55px 0 75px;
    }

    .eyebrow {
      color: var(--cyan);
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .heading {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.15;
      margin: 12px 0;
    }

    .heading p {
      color: var(--muted);
    }

    .preview {
      height: 320px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at center, rgba(124,92,255,.2), transparent 65%),
        #090d17;
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    .shape {
      width: 90px;
      height: 90px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--cyan), var(--accent));
    }

    .float {
      animation: float 2.5s ease-in-out infinite;
    }

    .spin {
      animation: spin 4s linear infinite;
    }

    .pulse {
      animation: pulse 1.6s ease-in-out infinite;
    }

    .bounce {
      animation: bounce 1.5s ease-in-out infinite;
    }

    .glow {
      animation: glow 2s ease-in-out infinite alternate;
    }

    .slide-in {
      animation: slideIn 2s ease-in-out infinite alternate;
    }

    @keyframes float {
      50% { transform: translateY(-25px); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      50% { transform: scale(1.3); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(15px); }
      50% { transform: translateY(-15px); }
    }

    @keyframes glow {
      from { box-shadow: 0 0 5px var(--cyan); }
      to {
        box-shadow: 0 0 35px var(--accent), 0 0 55px var(--cyan);
      }
    }

    @keyframes slideIn {
      from {
        transform: translateX(-40px);
        opacity: .3;
      }
      to {
        transform: translateX(40px);
        opacity: 1;
      }
    }

    .details {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 25px;
    }

    .details h2 {
      margin-bottom: 8px;
    }

    .details p {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      text-align: center;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      background: linear-gradient(110deg, var(--accent), #5140d8);
      color: white;
    }

    .btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 25px 0;
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
    }

    @media (max-width: 560px) {
      .preview {
        height: 250px;
      }

      .details {
        padding: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="container nav">
      <a class="logo" href="index.html">BR <span>DEV TEAM</span></a>
      <a class="back" id="backLink" href="collection.html">← Back to Collection</a>
    </div>
  </header>

  <main class="container">
    <section class="heading">
      <div class="eyebrow">Animation Preview</div>
      <h1 id="animationTitle">Animation Style</h1>
      <p id="animationDescription">Preview your selected animation.</p>
    </section>

    <section class="preview" aria-label="Animation preview">
      <div class="shape" id="animatedShape"></div>
    </section>

    <section class="details">
      <h2>About This Animation</h2>
      <p id="detailsText">
        Explore this animation style for your website.
      </p>

      <div class="actions">
        <a class="btn" id="requestButton" href="collection.html">
          Request This Style
        </a>
        <a class="btn secondary" id="backButton" href="collection.html">
          Back to Collection
        </a>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      © <span id="year"></span> BR DEV TEAM DEVELOPERS
    </div>
  </footer>

  <script>
    const animationStyles = {
      "Floating Gradient": {
        className: "float",
        description: "A smooth floating effect for modern website sections.",
        details: "This animation gently moves an element up and down. It can be used for hero graphics, cards, and decorative elements."
      },
      "Infinite Spin": {
        className: "spin",
        description: "A continuous rotation effect for icons and visual elements.",
        details: "This animation continuously rotates an element. It can be used for icons, loaders, and decorative shapes."
      },
      "Soft Pulse": {
        className: "pulse",
        description: "A gentle scaling effect that draws attention.",
        details: "This animation smoothly increases and decreases an element's size. It can be used to highlight buttons or important content."
      },
      "Motion Bounce": {
        className: "bounce",
        description: "A playful bounce animation for interactive designs.",
        details: "This animation moves an element up and down with a bouncing motion. It can add movement to playful interfaces."
      },
      "Neon Glow": {
        className: "glow",
        description: "A glowing animation for bold and futuristic interfaces.",
        details: "This animation changes the glow around an element. It can be used for futuristic cards, buttons, and visual accents."
      },
      "Slide In": {
        className: "slide-in",
        description: "A smooth sliding effect for modern website elements.",
        details: "This animation moves an element horizontally while changing its opacity. It can be used to add motion to interface elements."
      }
    };

    const params = new URLSearchParams(window.location.search);
    const styleName = params.get("style") || "Floating Gradient";
    const collectionKey = params.get("collection") || "modern";

    const selectedStyle =
      animationStyles[styleName] || animationStyles["Floating Gradient"];

    const collectionUrl =
      "collection.html?collection=" + encodeURIComponent(collectionKey);

    document.getElementById("animationTitle").textContent = styleName;
    document.getElementById("animationDescription").textContent =
      selectedStyle.description;
    document.getElementById("detailsText").textContent =
      selectedStyle.details;

    document.getElementById("animatedShape").classList.add(
      selectedStyle.className
    );

    document.getElementById("backLink").href = collectionUrl;
    document.getElementById("backButton").href = collectionUrl;

    const requestUrl =
      "mailto:brdevteam@example.com" +
      "?subject=" + encodeURIComponent("Animation Style Request") +
      "&body=" + encodeURIComponent(
        `Hi BR DEV TEAM DEVELOPERS! I'm interested in the "${styleName}" animation from the "${collectionKey}" collection.`
      );

    document.getElementById("requestButton").href = requestUrl;

    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
